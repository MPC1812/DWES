<H1>Registrar nuevo usuario</H1>
<form action="" method="post">
    <label for="user_id">Usuario (id):
        <input type="text" name="user_id" id="user_id">
    </label><br>
    <label for="zona_id">Zona (id):
        <input type="text" name="zona_id" id="zona_id">
    </label><br>
    <label for="fecha">Fecha (aaaa-mm-dd):
        <input type="text" name="fecha" id="fecha">
    </label><br>

        <input type="text" name="horainicio" id="horainicio">

    <label for="horafin">Hora fin reserva (hh:mm): 
        <input type="text" name="horafin" id="horafin">
    </label><br>

</form>
